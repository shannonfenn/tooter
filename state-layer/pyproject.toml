[project]
name = "tooter-state"
version = "0.1.0"
description = "State layer for tooter study workspaces: schemas, CLI face, and (Phase 1) MCP face."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
tooter-state = "tooter_state.cli:main"
tooter-state-mcp = "tooter_state.mcp:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
